# Moi lan doi <Version> trong src/DeskPanel.csproj va day len nhanh main:
# GitHub build app Android (APK) va ban Windows (APK nam san trong exe), tao tag vX.Y.Z va Release kem
# DeskPanel-Setup-X.Y.Z.exe (cai moi), zip (de DeskPanel tu cap nhat) va APK.
# DeskPanel tren may nguoi dung doc Release moi nhat de hien nut "Cai ban ...".
name: Release

on:
  push:
    branches: [main]
    paths: ['src/**', 'pkg/**', 'android/**', 'extension/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Doc so phien ban
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' src/DeskPanel.csproj)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Da co Release v$v, bo qua."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappVersion=${{ needs.version.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk ../deskpanel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: deskpanel.apk

  build:
    needs: [version, android]
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: src/wwwroot

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tien ich Chrome/Edge
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath src/wwwroot/deskpanel-extension.zip

      - name: Build
        shell: pwsh
        run: dotnet publish src/DeskPanel.csproj -c Release -r win-x64 -o out/DeskPanel

      - name: Dong goi
        shell: pwsh
        run: |
          if (-not (Test-Path out/DeskPanel/wwwroot/deskpanel.apk)) { throw "Thieu deskpanel.apk trong ban Windows" }
          Copy-Item pkg/HUONG-DAN.md out/DeskPanel/
          Remove-Item out/DeskPanel/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/DeskPanel -DestinationPath "out/DeskPanel-$env:VER-win-x64.zip"
          Copy-Item src/wwwroot/deskpanel.apk "out/DeskPanel-$env:VER.apk"
          # Mot file cai dat duy nhat: giao dien va APK da nam trong exe
          Copy-Item out/DeskPanel/DeskPanel.exe "out/DeskPanel-Setup-$env:VER.exe"
          Copy-Item src/wwwroot/deskpanel-extension.zip "out/DeskPanel-extension-$env:VER.zip"

      - name: Tao Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v$env:VER" "out/DeskPanel-Setup-$env:VER.exe" "out/DeskPanel-$env:VER-win-x64.zip" "out/DeskPanel-$env:VER.apk" "out/DeskPanel-extension-$env:VER.zip" `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "DeskPanel $env:VER" --notes-file pkg/CHANGELOG-latest.md
