<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskPanel · Bảo mật và quyền riêng tư</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--mu:#8b949e;--line:#30363d;--acc:#58a6ff}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .6em}h2{font-size:1.15rem;margin:1.6em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;margin:.5em 0;font-size:.92rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:#161b22}
code{background:#161b22;padding:1px 5px;border-radius:5px;font-size:.9em}
a{color:var(--acc)}hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.back{display:inline-block;margin-bottom:12px;color:var(--mu);text-decoration:none}
</style></head>
<body><main><a class="back" href="settings.html">← Cài đặt</a><div id="doc">Đang tải…</div></main>
<script>
// Hien SECURITY.md (Markdown don gian: tieu de, bang, danh sach, dam, code)
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function md(t){
  var out = [], lines = t.split(/\r?\n/), i = 0;
  while (i < lines.length) {
    var l = lines[i];
    if (/^#{1,3} /.test(l)) { var n = l.match(/^#+/)[0].length; out.push('<h' + n + '>' + inline(l.slice(n + 1)) + '</h' + n + '>'); i++; continue; }
    if (/^---\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\|/.test(l)) {
      var rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      var cells = function(r){ return r.replace(/^\||\|$/g,'').split('|').map(function(c){ return inline(c.trim()); }); };
      var h = '<table><tr>' + cells(rows[0]).map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr>';
      rows.slice(2).forEach(function(r){ h += '<tr>' + cells(r).map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^- /.test(l)) { var li = []; while (i < lines.length && /^- /.test(lines[i])) li.push('<li>' + inline(lines[i++].slice(2)) + '</li>'); out.push('<ul>' + li.join('') + '</ul>'); continue; }
    if (l.trim() === '') { i++; continue; }
    var p = []; while (i < lines.length && lines[i].trim() !== '' && !/^(#|\||- |---)/.test(lines[i])) p.push(lines[i++]);
    out.push('<p>' + inline(p.join(' ')) + '</p>');
  }
  return out.join('\n');
}
// File co 2 phan: tieng Viet truoc, tieng Anh sau dong <!-- en -->
var en = false; try { en = localStorage.getItem('dp.lang') === 'en'; } catch(e) {}
if (en) { document.documentElement.lang = 'en'; document.title = 'DeskPanel · Security and privacy'; document.querySelector('.back').textContent = '← Settings'; document.getElementById('doc').textContent = 'Loading…'; }
fetch('privacy.md').then(function(r){ return r.text(); }).then(function(t){
  var parts = t.split(/\r?\n<!-- en -->\r?\n/);
  document.getElementById('doc').innerHTML = md(en && parts[1] ? parts[1] : parts[0]);
}).catch(function(){ document.getElementById('doc').textContent = en ? 'Could not load.' : 'Không tải được.'; });
</script>
</body></html>
